name: Repair source formatting and validate

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-and-validate:
    name: Format source and run checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref != 'refs/heads/main'
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format tracked TypeScript and JavaScript source
        run: |
          git ls-files -z 'src/*.ts' 'src/*.tsx' 'src/*.js' 'src/*.jsx' 'src/**/*.ts' 'src/**/*.tsx' 'src/**/*.js' 'src/**/*.jsx' |
            tr '\0' '\n' |
            grep -v 'routeTree.gen.ts' |
            xargs -r bunx prettier --write

      - name: Commit formatting changes to selected non-main branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "Refusing to write formatting changes to main."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
          else
            git commit -m "style: format TypeScript and JavaScript source"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Run ESLint
        id: lint
        continue-on-error: true
        run: bun run lint

      - name: Run tests
        id: tests
        continue-on-error: true
        run: bun run test

      - name: Build application
        id: build
        continue-on-error: true
        run: bun run build

      - name: Report validation results
        if: always()
        run: |
          echo "Lint outcome: ${{ steps.lint.outcome }}"
          echo "Tests outcome: ${{ steps.tests.outcome }}"
          echo "Build outcome: ${{ steps.build.outcome }}"
