name: Repair main formatting and validate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-format-repair
  cancel-in-progress: false

jobs:
  format-and-validate:
    name: Format main and validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format tracked TypeScript and JavaScript source
        run: |
          git ls-files -z 'src/*.ts' 'src/*.tsx' 'src/*.js' 'src/*.jsx' 'src/**/*.ts' 'src/**/*.tsx' 'src/**/*.js' 'src/**/*.jsx' |
            tr '\0' '\n' |
            grep -v 'routeTree.gen.ts' |
            xargs -r bunx prettier --write

      - name: Commit formatting changes to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
          else
            git commit -m "style: format TypeScript and JavaScript source"
            git push origin HEAD:main
          fi

      - name: Run ESLint
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Build application
        run: bun run build
